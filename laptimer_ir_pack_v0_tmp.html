<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="app-title">LapTimer_3digit</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f0f0; margin: 0; padding: 20px; }
        h1 { color: #333; margin-bottom: 5px; }
        
        /* 🔒 画面を占有しないためのポップアップ（モーダル）設定 */
        .modal-overlay {
            display: none; /* 初期状態は非表示 */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .config-box { 
            background: white; padding: 25px; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 85%; max-width: 360px; 
        }
        
        .btn { background: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 5px; }
        .btn:disabled { background: #ccc; }
        .btn-danger { background: #dc3545; }
        .btn-success { background: #28a745; width: 100%; margin-top: 15px; font-weight: bold; }
        
        .config-row { margin: 15px 0; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        select, input { padding: 8px; font-size: 16px; width: 100px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
        label { font-size: 16px; font-weight: bold; color: #333; }
        
        /* 🏎️ メイン計測画面のレイアウト */
        .time-display { font-size: 56px; font-weight: bold; font-family: monospace; margin: 25px 0; color: #111; letter-spacing: 2px; }
        .stats-table { width: 100%; max-width: 400px; margin: 20px auto; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stats-table th, .stats-table td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 15px; }
        .stats-table th { background: #f8f9fa; font-weight: bold; }
        .status-bar { font-weight: bold; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- 💡 モードによって動的に変更されるタイトル -->
    <h1 id="display-title">LapTimer_3digit</h1>
    <div id="status" class="status-bar" style="color: #dc3545;">⚠ 「M5Atomと接続する」ボタンを押してください。</div>

    <!-- 📱 常駐コントロールボタン -->
    <div style="margin-bottom: 10px;">
        <button class="btn" id="btn-connect" onclick="connectBLE()">M5Atomと接続する</button>
        <button class="btn btn-danger" onclick="clearHistory()">履歴削除</button>
        <button class="btn" style="background:#6c757d;" onclick="exportCSV()">.csv</button>
        <!-- 接続後に再設定したくなった場合の再表示用ボタン -->
        <button class="btn" id="btn-reconfig" style="background:#17a2b8; display:none;" onclick="showModal()">設定変更</button>
    </div>

    <!-- 🏎️ タイム表示エリア -->
    <div class="time-display" id="main-time">--.---</div>

    <!-- 📊 履歴統計テーブル -->
    <table class="stats-table">
        <thead>
            <tr><th>Lap</th><th>Time</th><th>Ave.</th><th>Sum.</th></tr>
        </thead>
        <tbody id="stats-body">
            <!-- 受信データがここに動的に挿入されます -->
        </tbody>
    </table>

    <!-- 🛠️ ポップアップ（モーダル）設定画面エリア -->
    <div class="modal-overlay" id="config-modal">
        <div class="config-box">
            <h3 style="margin-top:0; color:#333; border-bottom:2px solid #007bff; padding-bottom:8px;">計測システム設定</h3>
            
            <div class="config-row">
                <label for="set-mode">モード</label>
                <select id="set-mode" onchange="updateAppLayout()">
                    <option value="1" selected>モード1 (本番3桁)</option>
                    <option value="2">モード2 (解析6桁)</option>
                    <option value="3">モード3 (補正6桁)</option>
                </select>
            </div>
            
            <div class="config-row">
                <label for="width-min">最小受信幅</label>
                <input type="number" id="width-min" value="5">
            </div>
            
            <div class="config-row">
                <label for="width-max">最大受信幅</label>
                <input type="number" id="width-max" value="45">
            </div>
            
            <button class="btn btn-success" id="btn-set" onclick="sendConfig()">OK （設定を送信して閉じる）</button>
        </div>
    </div>



    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let bluetoothDevice = null;
        let rxTxCharacteristic = null;
        let lapTimes = [];
        let isFirstData = true;

        // ポップアップ（モーダル）を表示する関数
        function showModal() {
            document.getElementById("config-modal").style.display = "flex";
        }

        // ポップアップ（モーダル）を閉じる（消去する）関数
        function hideModal() {
            document.getElementById("config-modal").style.display = "none";
        }

        // モード選択変更時にタイトルや表示桁数を動的に切り替える関数
        function updateAppLayout() {
            const mode = document.getElementById("set-mode").value;
            const appTitle = document.getElementById("app-title");
            const displayTitle = document.getElementById("display-title");

            if (mode === "1") {
                appTitle.innerText = "LapTimer_3digit";
                displayTitle.innerText = "LapTimer_3digit";
                document.getElementById("main-time").innerText = "--.---";
            } else {
                appTitle.innerText = "Capture_6digit";
                displayTitle.innerText = "Capture_6digit";
                document.getElementById("main-time").innerText = "--.------";
            }
            clearHistory();
        }

        // 音声アナウンス処理
        function speak(text) {
            const mode = document.getElementById("set-mode").value;
            // モード2, 3の時は「計測開始します」以外のアナウンスをすべてミュート（中止）する
            if ((mode === "2" || mode === "3") && text !== "計測開始します") {
                return; 
            }
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = "ja-JP";
            window.speechSynthesis.speak(uttr);
        }

        // Web Bluetooth 接続処理
        async function connectBLE() {
            try {
                document.getElementById("status").innerText = "接続中...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: "m5atom_laptimer" }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                rxTxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                // ATOMからのデータ通知(Notify)を受け取る設定
                await rxTxCharacteristic.startNotifications();
                rxTxCharacteristic.addEventListener('characteristicvaluechanged', handleDataReceived);

                document.getElementById("status").innerText = "🔵 M5Atomと接続完了";
                document.getElementById("status").style.color = "green";
                document.getElementById("btn-connect").disabled = true;
                document.getElementById("btn-reconfig").style.display = "inline-block"; // 設定変更ボタンを使えるように
                
                speak("接続しました");

                // 接続成功後、自動的に設定画面をポップアップ表示させる
                showModal();

            } catch (error) {
                console.error(error);
                document.getElementById("status").innerText = "❌ 接続失敗。再試行してください。";
                document.getElementById("status").style.color = "red";
            }
        }

        // 設定値の送信 (CSV形式: "set,1,5,45")
        async function sendConfig() {
            if (!rxTxCharacteristic) return;
            const mode = document.getElementById("set-mode").value;
            const minW = document.getElementById("width-min").value;
            const maxW = document.getElementById("width-max").value;
            
            const cmdStr = `set,${mode},${minW},${maxW}`;
            const encoder = new TextEncoder();
            await rxTxCharacteristic.writeValue(encoder.encode(cmdStr));
            
            document.getElementById("status").innerText = `🟢 稼働中 (モード${mode}設定済)`;
            
            // 設定値の送信直後、パルスキャプチャ開始指令「PREP」を連投
            await rxTxCharacteristic.writeValue(encoder.encode("PREP"));
            
            // 設定完了後にポップアップを完全に消去して計測画面を全画面表示
            hideModal();

            // 計測準備完了のアナウンス
            speak("計測開始します");
            isFirstData = true;
        }

        // ATOMからデータを受信した際の解析処理（バグ修正版）
        function handleDataReceived(event) {
    const value = new TextDecoder().decode(event.target.value).trim();
    console.log("Received: ", value);

    // ★重要：ATOMが最初の横切り（スタート）を検知した瞬間、スマホ側も完全同期
    if (value === "START") {
        document.getElementById("main-time").innerText = "0.000";
        isFirstData = false; // 次に飛んでくる「L:」パルスが、純粋な「1周目のラップタイム」になる
        speak("計測を開始しました");
        return;
    }

    // 【モード1・モード2用データ解析】 ("L:マイクロ秒" 形式)
    if (value.startsWith("L:")) {
        const parts = value.split(":");
        if (parts.length >= 2) {
            const micros = parseFloat(parts[1]);
            if (!isNaN(micros)) {
                const seconds = micros / 1000000.0;
                processNewLapTime(seconds);
            }
        }
    }
    // 【モード3用データ解析】 ("ID:0,T:マイクロ秒" 形式)
    else if (value.startsWith("ID:")) {
        const parts = value.split(","); 
        if (parts.length >= 2) {
            const idPart = parts[0].split(":"); 
            const tPart = parts[1].split(":");  
            
            if (idPart.length >= 2 && tPart.length >= 2) {
                const carId = idPart[1].trim();
                const micros = parseFloat(tPart[1]);
                
                if (!isNaN(micros) && carId === "0") {
                    const seconds = micros / 1000000.0;
                    processNewLapTime(seconds);
                }
            }
        }
    }
}

        function processNewLapTime(seconds) {
            const mode = document.getElementById("set-mode").value;
            
            if (isFirstData) {
                isFirstData = false;
                if (mode === "1") {
                    document.getElementById("main-time").innerText = seconds.toFixed(3);
                    return; // モード1の初回トリガーは基準点としてタイム表示のみ行い履歴はスキップ
                }
            }

            lapTimes.push(seconds);
            const decimalPlaces = (mode === "1") ? 3 : 6;
            
            // メイン画面のTime表示更新
            document.getElementById("main-time").innerText = seconds.toFixed(decimalPlaces);

            // 音声読み上げ（モード1のみ動作。モード2, 3は自動的に消音されます）
            speak(`${lapTimes.length}ラップ、${seconds.toFixed(2)}秒`);

            // テーブル集計の計算
            const sum = lapTimes.reduce((a, b) => a + b, 0);
            const ave = sum / lapTimes.length;

            const tbody = document.getElementById("stats-body");
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${lapTimes.length}</td>
                <td>${seconds.toFixed(decimalPlaces)}</td>
                <td>${ave.toFixed(decimalPlaces)}</td>
                <td>${sum.toFixed(decimalPlaces)}</td>
            `;
            tbody.insertBefore(row, tbody.firstChild); // 最新データを一番上へ
        }

        function clearHistory() {
            lapTimes = [];
            document.getElementById("stats-body").innerHTML = "";
            const mode = document.getElementById("set-mode").value;
            document.getElementById("main-time").innerText = (mode === "1") ? "--.---" : "--.------";
        }

        function exportCSV() {
            if (lapTimes.length === 0) return;
            const mode = document.getElementById("set-mode").value;
            const decimalPlaces = (mode === "1") ? 3 : 6;
            
            let csvContent = "data:text/csv;charset=utf-8,Lap,Time\n";
            lapTimes.forEach((t, i) => {
                csvContent += `${i + 1},${t.toFixed(decimalPlaces)}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `laptimer_data_mode${mode}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
