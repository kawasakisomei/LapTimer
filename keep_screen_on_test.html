<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wake Lock テスト</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f0f0; }
        button { padding: 15px 25px; font-size: 16px; margin: 10px; cursor: pointer; }
        #status { font-weight: bold; margin-top: 20px; color: blue; }
    </style>
</head>
<body>

    <h2>Wake Lock 画面消灯禁止テスト</h2>
    
    <!-- 指定されたボタン要素 -->
    <button id="connectBtn">M5Atomと接続する</button>

    <!-- テスト状態を表示するエリア -->
    <div id="status">画面をタップするか、上のボタンを押してテストを開始してください</div>

    <script>
    // ----------------------------------------------------
    // JavaScript部はここから指定コードのみになります
    // ----------------------------------------------------
    let wakeLock = null;

    async function requestWakeLock() {
        if ('wakeLock' in navigator) {
            try {
                if (wakeLock !== null) return; 

                wakeLock = await navigator.wakeLock.request('screen');
                document.getElementById("status").textContent = "🟢 画面消灯禁止（Wake Lock）が有効です！画面は消えません。";
                
                wakeLock.addEventListener('release', () => {
                    document.getElementById("status").textContent = "🔴 画面消灯禁止が解除されました。";
                    wakeLock = null; 
                });
            } catch (err) {
                document.getElementById("status").textContent = `❌ エラー: ${err.message}`;
            }
        } else {
            document.getElementById("status").textContent = "❌ お使いのブラウザ・環境はWake Lockに対応していません。";
        }
    }

    // 既存の画面タッチイベント
    window.addEventListener('click', () => {
        requestWakeLock();
    }, { capture: true });

    // 指定のボタン（connectBtn）イベント
    document.getElementById("connectBtn").addEventListener("click", () => {
        requestWakeLock();
    });

    // タブ切り替え・バックグラウンドからの復帰対策
    document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible') {
            await requestWakeLock();
        }
    });
    </script>
</body>
</html>
